<body>

    <div class="container">
        <header>
            <div class="header-content">
                <a href="index.html">
                    <img src="headshot.jpg" alt="Ryan S. Gladwin" class="profile-img">
                </a>
                <div class="header-text">
                    <h1>Ryan S. Gladwin</h1>

                </div>
            </div>
        </header>

        <nav class="work-nav">
            <a href="index.html">Home</a>
            <a href="writing.html">Writing</a>
            <a href="video.html">Video Content</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

        <main>
            <section id="contact-page">
                <h2>Get in Touch</h2>
                <p>Have a story tip, a freelance assignment, or just want to say hi? Fill out the form below, or reach me directly at <a href="mailto:ryan.s.gladwin@gmail.com" style="color: var(--accent);">ryan.s.gladwin@gmail.com</a>.</p>

                <div class="contact-box">
                    <!--
                        NOTE FOR RYAN: this form posts to Formspree, a free service
                        that emails you submissions without needing a backend.
                        1. Go to formspree.io, sign up free, create a form.
                        2. Replace YOUR_FORM_ID below with the ID they give you.
                    -->
                    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="_subject" required>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>

                        <button type="submit" class="btn-editorial" style="margin-top: 1.25rem;">
                            <i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i> Send Message
                        </button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <div class="links">
                <a href="mailto:ryan.s.gladwin@gmail.com"><i class="fa-solid fa-envelope"></i> Email</a>
                <a href="https://x.com/Ryan_S_Gladwin" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i> X / Twitter</a>
                <a href="https://www.linkedin.com/in/ryansgladwin/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
            </div>
            <p class="colophon">Built with HTML/CSS</p>
        </footer>
    </div>

</body>
